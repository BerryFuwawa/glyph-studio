name: 发布

on:
  push:
    tags:
      - 'v*'

# The release job below narrows this to contents: write. All other jobs and
# steps, if added later, inherit read-only repository access.
permissions:
  contents: read

jobs:
  release:
    name: 构建并发布 Windows 便携版
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出标签源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 设置 Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 验证标签与 package.json 版本一致
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v.+') {
            throw "Release tag '$env:RELEASE_TAG' must start with v."
          }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$packageVersion'."
          }

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 预热 Electron 二进制文件
        run: npm run prebuild

      - name: 构建 Windows 便携版可执行文件
        run: npm run build

      - name: 准备发布资产
        id: assets
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'dist' -Filter '*.exe' -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one Windows portable executable in dist, found $($assets.Count)."
          }

          $asset = $assets[0]
          $checksum = Join-Path $asset.DirectoryName "$($asset.Name).sha256"
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($asset.Name)" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM

          "asset_name=$($asset.Name)" >> $env:GITHUB_OUTPUT
          "checksum_name=$([IO.Path]::GetFileName($checksum))" >> $env:GITHUB_OUTPUT

      - name: 发布 GitHub 版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ steps.assets.outputs.asset_name }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum_name }}
        run: |
          $assetPath = Join-Path 'dist' $env:ASSET_NAME
          $checksumPath = Join-Path 'dist' $env:CHECKSUM_NAME
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $notesPath = Join-Path 'docs' "release-$version.md"
          if (Test-Path -LiteralPath $notesPath) {
            $notesArgs = @('--notes-file', $notesPath)
          } else {
            $notesArgs = @('--notes', "该版本由标签 $env:GITHUB_REF_NAME 发布，请参阅仓库提交记录了解本次变更。")
          }

          # Upload only the executable and checksum. GitHub supplies the tag's
          # source archives automatically; no duplicate source zip is created.
          gh release create $env:GITHUB_REF_NAME $assetPath $checksumPath `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "字相 · Glyph Studio $env:GITHUB_REF_NAME" `
            @notesArgs
